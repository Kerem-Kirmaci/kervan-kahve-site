[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Basılı QR kodları https://kervankahve.com/menu adresine gidiyor.
# Netlify uzantısız adresleri kendisi çözüyor, yine de sondaki eğik çizgili
# ve alt yollu hâller için açık kural bırakıyoruz.
[[redirects]]
  from = "/menu/*"
  to = "/menu.html"
  status = 301
  force = true

# Kategoriler kendi sayfalarına taşındı (src/pages/[kategori].astro).
# Eski /shop.html?category=... adresleri ana sayfadan, ürün föyünden ve
# dışarıya paylaşılmış bağlantılardan geliyor olabilir; Google'ın da eski
# adresi yenisine bağlaması için 301. Eşleme src/data/kategoriler.js ile
# aynı olmalı. `force` şart: /shop.html gerçek bir dosya ve Netlify, dosya
# varken yönlendirmeyi ancak force ile uygular.
[[redirects]]
  from = "/shop.html"
  to = "/toptan-surup.html"
  status = 301
  force = true
  query = { category = "surup" }

[[redirects]]
  from = "/shop.html"
  to = "/toptan-sos-ve-pure.html"
  status = 301
  force = true
  query = { category = "pure-tatlandirici" }

[[redirects]]
  from = "/shop.html"
  to = "/toptan-hazir-tatli.html"
  status = 301
  force = true
  query = { category = "tatli" }

[[redirects]]
  from = "/shop.html"
  to = "/toptan-kahve.html"
  status = 301
  force = true
  query = { category = "espresso" }

[[redirects]]
  from = "/shop.html"
  to = "/toptan-bitki-cayi.html"
  status = 301
  force = true
  query = { category = "cay" }

[[redirects]]
  from = "/shop.html"
  to = "/kafe-ekipmanlari.html"
  status = 301
  force = true
  query = { category = "aksesuar" }

# Sitemap adresi Astro'ya geçişte /sitemap.xml'den /sitemap-index.xml'e taşındı.
# robots.txt yenisini gösteriyor, ama eski adrese dışarıdan referans kalmışsa
# boşa düşmesin.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Astro, işlediği dosyaların adına içerik özeti basıyor
# (anasayfa.B6bm1AUo_1Faovd.webp). İçerik değişirse ad da değişir, bu yüzden
# bu dosyalar süresiz önbelleklenebilir. Netlify varsayılanı her ziyarette
# yeniden doğrulama yaptırıyordu; tekrar ziyaretler artık ağa çıkmıyor.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
