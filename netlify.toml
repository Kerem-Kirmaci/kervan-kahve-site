[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Basılı QR kodları https://kervankahve.com/menu adresine gidiyor.
# Netlify uzantısız adresleri kendisi çözüyor, yine de sondaki eğik çizgili
# ve alt yollu hâller için açık kural bırakıyoruz.
[[redirects]]
  from = "/menu/*"
  to = "/menu.html"
  status = 301
  force = true

# Astro, işlediği dosyaların adına içerik özeti basıyor
# (anasayfa.B6bm1AUo_1Faovd.webp). İçerik değişirse ad da değişir, bu yüzden
# bu dosyalar süresiz önbelleklenebilir. Netlify varsayılanı her ziyarette
# yeniden doğrulama yaptırıyordu; tekrar ziyaretler artık ağa çıkmıyor.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
